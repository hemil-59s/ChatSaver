<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatSaver Settings</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #1a1a1a;
      --border-color: #2a2a2a;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --accent-blue: #3498db;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      width: 360px;
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: var(--font-main);
      padding: 0;
      margin: 0;
    }

    header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: var(--transition-fast);
      display: flex;
      align-items: center;
    }

    .back-btn:hover {
      background-color: #252525;
      color: var(--text-primary);
    }

    h2 {
      font-size: 16px;
      font-weight: 600;
    }

    main {
      padding: 20px 16px;
    }

    .info-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .info-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--accent-blue);
    }

    .info-text {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-secondary);
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-secondary { background-color: #2a2a2a; color: var(--text-primary); }
    .btn-secondary:hover { background-color: #3a3a3a; }
  </style>
</head>
<body>
  <header>
    <button id="back-btn" class="back-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <h2>Settings</h2>
  </header>

  <main>
    <div class="info-card">
      <div class="info-title">Privacy & Offline Mode</div>
      <div class="info-text">
        ChatSaver now works 100% offline. No API keys are required, and your data never leaves your browser. 
        <br><br>
        All chat extractions and exports are processed locally on your device.
      </div>
    </div>

    <div class="info-card">
      <div class="info-title">Version</div>
      <div class="info-text">ChatSaver v1.1.0</div>
    </div>

    <button id="back-to-popup" class="btn btn-secondary">
      Back to Chats
    </button>
  </main>

  <script src="settings.js"></script>
</body>
</html>
